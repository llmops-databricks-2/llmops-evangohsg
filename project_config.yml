  catalog: "llmops_dev"
  schema: "evangohsg"
  volume: "arxiv_files"
  llm_endpoint: "course_ops.gateway.chat"
  embedding_endpoint: "course_ops.gateway.embed"
  warehouse_id: "38ac974041fe250e"
  experiment_path: "/llmops/evangohsg-dev"
